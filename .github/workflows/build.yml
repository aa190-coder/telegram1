name: Build Telegram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Download Telegram source
        run: git clone --recursive --shallow-submodules https://github.com/DrKLO/Telegram.git Telegram

      - name: Show downloaded files
        run: ls -la Telegram
